[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "freedom-agents"
version = "0.1.3"
description = "Workflow definition primitives and durable execution for Django applications."
readme = { text = "Define agents, choices, steps, and workflows through agents.inferences, agents.tools, agents.steps, and agents.workflows, then execute them through agents.runner.", content-type = "text/plain" }
requires-python = ">=3.11"
dependencies = [
    "Django==4.2.27",
    "djangorestframework==3.15.2",
    "fastmcp>=2,<3",
    "pydantic>=2.11,<3",
    "httpx>=0.27,<1",
    "temporalio>=1.18.0",
    "coding-agent-drivers",
]

[tool.setuptools]
include-package-data = true
package-dir = {agents = "src"}
packages = [
    "agents",
    "agents.adapters",
    "agents.adapters.inference",
    "agents.adapters.inference.codex",
    "agents.adapters.temporal",
    "agents.adapters.temporal.plugins",
    "agents.adapters.tools",
    "agents.adapters.tools.mcp",
    "agents.catalog",
    "agents.core",
    "agents.core.inference",
    "agents.core.inference.adapters",
    "agents.core.tools",
    "agents.inferences",
    "agents.management",
    "agents.management.commands",
    "agents.migrations",
    "agents.runner",
    "agents.runner.tools",
    "agents.steps",
    "agents.tools",
    "agents.workflows",
]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
]

[tool.uv.sources]
coding-agent-drivers = { path = "../coding-agent-drivers", editable = true }
