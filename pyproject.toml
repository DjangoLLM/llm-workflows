[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "freedom-agents"
version = "0.1.3"
description = "Reusable Django app for core agent runtime and pipeline execution."
readme = { text = "Core reusable app for agent orchestration and pipeline execution.", content-type = "text/plain" }
requires-python = ">=3.11"
dependencies = [
    "Django==4.2.27",
    "djangorestframework==3.15.2",
    "fastmcp>=2,<3",
    "pydantic-ai==1.34.0",
    "temporalio>=1.18.0",
    "coding-agent-drivers",
]

[tool.uv.sources]
coding-agent-drivers = { path = "../coding-agent-drivers", editable = true }

[tool.setuptools]
include-package-data = true
packages = [
    "agents",
    "agents.management",
    "agents.management.commands",
    "agents.migrations",
    "agents.core",
    "agents.core.temporal",
    "agents.core.temporal.plugins",
    "agents.core.tools",
    "agents.core.tools.mcp",
]

[tool.setuptools.package-dir]
agents = "."

[dependency-groups]
dev = [
    "pytest>=9.0.2",
]
