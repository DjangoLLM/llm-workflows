[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "freedom-agents"
version = "0.1.0"
description = "Reusable Django app for core agent runtime and pipeline execution."
readme = { text = "Core reusable app for agent orchestration and pipeline execution.", content-type = "text/plain" }
requires-python = ">=3.11"
dependencies = [
    "Django==4.2.27",
    "djangorestframework==3.15.2",
    "pydantic-ai==1.34.0",
    "temporalio>=1.18.0",
]

[tool.setuptools]
include-package-data = true
packages = [
    "agents",
    "agents.management",
    "agents.management.commands",
    "agents.migrations",
    "agents.pipelines",
    "agents.temporal",
    "agents.views",
]

[tool.setuptools.package-dir]
agents = "."
