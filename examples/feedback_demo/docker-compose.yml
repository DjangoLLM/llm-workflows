services:
  temporal:
    image: temporalio/temporal:latest
    command: ["server", "start-dev", "--ip", "0.0.0.0"]
    ports:
      - "7233:7233"
      - "8233:8233"

  web:
    build:
      context: ../..
      dockerfile: examples/feedback_demo/Dockerfile
    env_file:
      - path: .env
        required: false
    environment:
      DJANGO_SETTINGS_MODULE: feedback_demo.settings
      SQLITE_PATH: /data/db.sqlite3
      TEMPORAL_SERVER_URL: temporal:7233
      TEMPORAL_TASK_QUEUE: ai-pipeline-queue
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o}
    command: >
      sh -c "python wait_for_temporal.py &&
             python manage.py migrate --run-syncdb --noinput &&
             python manage.py runserver 0.0.0.0:8000"
    ports:
      - "8000:8000"
    volumes:
      - feedback_demo_data:/data
    depends_on:
      - temporal

  worker:
    build:
      context: ../..
      dockerfile: examples/feedback_demo/Dockerfile
    env_file:
      - path: .env
        required: false
    environment:
      DJANGO_SETTINGS_MODULE: feedback_demo.settings
      SQLITE_PATH: /data/db.sqlite3
      TEMPORAL_SERVER_URL: temporal:7233
      TEMPORAL_TASK_QUEUE: ai-pipeline-queue
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o}
    command: >
      sh -c "python wait_for_temporal.py &&
             python manage.py migrate --run-syncdb --noinput &&
             python manage.py run_temporal_worker"
    volumes:
      - feedback_demo_data:/data
    depends_on:
      - temporal

volumes:
  feedback_demo_data:
