[pytest]
DJANGO_SETTINGS_MODULE = tests.settings
django_find_project = false
python_files = test_*.py
testpaths =
    tests
addopts =
    -ra
    --strict-markers
    --strict-config
    --tb=short
    --cov=agents
    --cov-branch
    --cov-config=.coveragerc
    --cov-report=term-missing:skip-covered
    --cov-report=json:tests/artifacts/coverage.json
markers =
    live: Runs against real external services and fails hard when prerequisites are missing.
    codex_live: Runs typed acceptance against the authenticated Codex CLI.
norecursedirs =
    .*
    __pycache__
    build
    dist
    *.egg-info
    .venv
    node_modules
    migrations
