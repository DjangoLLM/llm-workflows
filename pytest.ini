[pytest]
DJANGO_SETTINGS_MODULE = agents.tests.settings
python_files = test_*.py
testpaths =
    agents/tests
addopts =
    -ra
    --strict-markers
    --strict-config
    --tb=short
    --cov=agents
    --cov-branch
    --cov-config=agents/.coveragerc
    --cov-report=term-missing:skip-covered
    --cov-report=json:agents/tests/artifacts/coverage.json
markers =
    live: Runs against real external services and fails hard when prerequisites are missing.
norecursedirs =
    .*
    __pycache__
    build
    dist
    *.egg-info
    .venv
    node_modules
    agents/migrations
